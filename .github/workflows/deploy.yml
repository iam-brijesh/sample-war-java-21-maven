name: MS1 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "helm/ms1/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::453168420398:role/GitHubActionsRole
  ECR_REPOSITORY: ms-1
  EKS_CLUSTER_NAME: hello-world-eks
  HELM_RELEASE: ms1
  HELM_CHART: ./helm/ms1


# ============================================================
# JOB 1 - BUILD + TEST + DOCKER + ECR
# ============================================================

jobs:

  build-and-push:

    name: Build MS1 and Push Image to ECR

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_repository: ${{ steps.image.outputs.repository }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # JAVA 21
      # --------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # --------------------------------------------------------
      # MAVEN BUILD
      # --------------------------------------------------------

      - name: Build WAR
        run: |
          echo "======================================"
          echo "BUILDING MS1 WAR"
          echo "======================================"

          mvn clean package -DskipTests


      # --------------------------------------------------------
      # VERIFY WAR
      # --------------------------------------------------------

      - name: Verify WAR
        run: |
          echo "======================================"
          echo "VERIFY WAR"
          echo "======================================"

          ls -lh target/

          test -f target/hello-world.war

          echo "WAR successfully created"


      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # VERIFY AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity


      # --------------------------------------------------------
      # LOGIN TO ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # SET IMAGE VARIABLES
      # --------------------------------------------------------

      - name: Set image variables
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_REPOSITORY="${REGISTRY}/${ECR_REPOSITORY}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "IMAGE INFORMATION"
          echo "======================================"

          echo "Repository : ${IMAGE_REPOSITORY}"
          echo "Tag        : ${IMAGE_TAG}"


      # --------------------------------------------------------
      # DOCKER BUILD
      # --------------------------------------------------------

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          echo "======================================"
          echo "DOCKER BUILD"
          echo "======================================"

          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .


      # --------------------------------------------------------
      # PUSH IMAGE TO ECR
      # --------------------------------------------------------

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          echo "======================================"
          echo "PUSHING IMAGE TO ECR"
          echo "======================================"

          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


      # --------------------------------------------------------
      # VERIFY ECR IMAGE
      # --------------------------------------------------------

      - name: Verify ECR image
        env:
          IMAGE_TAG: ${{ github.sha }}

        run: |
          echo "======================================"
          echo "VERIFY ECR IMAGE"
          echo "======================================"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

          echo "ECR image verified successfully"


# ============================================================
# JOB 2 - DEPLOY MS1 TO DEV
# ============================================================

  deploy-dev:

    name: Deploy MS1 to DEV

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    environment:
      name: dev

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # AWS IDENTITY
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # VERIFY EKS
      # --------------------------------------------------------

      - name: Verify EKS cluster
        run: |
          echo "======================================"
          echo "VERIFYING EKS CLUSTER"
          echo "======================================"

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text


      # --------------------------------------------------------
      # CONFIGURE KUBECONFIG
      # --------------------------------------------------------

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"


      # --------------------------------------------------------
      # VERIFY NODES
      # --------------------------------------------------------

      - name: Verify EKS nodes
        run: |
          kubectl get nodes -o wide


      # --------------------------------------------------------
      # SETUP HELM
      # --------------------------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest


      # --------------------------------------------------------
      # HELM VERSION
      # --------------------------------------------------------

      - name: Verify Helm
        run: |
          helm version


      # --------------------------------------------------------
      # HELM LINT
      # --------------------------------------------------------

      - name: Helm lint
        run: |
          helm lint "$HELM_CHART"


      # --------------------------------------------------------
      # HELM TEMPLATE VALIDATION
      # --------------------------------------------------------

      - name: Helm template validation
        run: |
          helm template "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace dev \
            -f "$HELM_CHART/values-dev.yaml" \
            --set image.repository="${{ needs.build-and-push.outputs.image_repository }}" \
            --set image.tag="${{ needs.build-and-push.outputs.image_tag }}"


      # --------------------------------------------------------
      # DEPLOY DEV
      # --------------------------------------------------------

      - name: Deploy MS1 to DEV
        run: |
          echo "======================================"
          echo "DEPLOYING MS1 TO DEV"
          echo "======================================"

          echo "Image:"
          echo "${{ needs.build-and-push.outputs.image_repository }}:${{ needs.build-and-push.outputs.image_tag }}"

          helm upgrade --install "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace dev \
            --create-namespace \
            -f "$HELM_CHART/values-dev.yaml" \
            --set image.repository="${{ needs.build-and-push.outputs.image_repository }}" \
            --set image.tag="${{ needs.build-and-push.outputs.image_tag }}" \
            --wait \
            --timeout 10m


      # --------------------------------------------------------
      # HELM STATUS
      # --------------------------------------------------------

      - name: Helm status DEV
        run: |
          helm status "$HELM_RELEASE" \
            --namespace dev


      # --------------------------------------------------------
      # ROLLOUT
      # --------------------------------------------------------

      - name: Check DEV rollout
        run: |
          kubectl rollout status \
            deployment/ms1-ms1 \
            -n dev \
            --timeout=5m


      # --------------------------------------------------------
      # VERIFY DEV
      # --------------------------------------------------------

      - name: Verify DEV deployment
        run: |
          echo "======================================"
          echo "DEV DEPLOYMENT STATUS"
          echo "======================================"

          kubectl get deployment -n dev
          kubectl get pods -n dev
          kubectl get svc -n dev
          kubectl get ingress -n dev

          echo "DEV deployment successful"


# ============================================================
# JOB 3 - DEPLOY MS1 TO QA
