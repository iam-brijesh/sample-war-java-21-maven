name: Sample WAR CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "022267197315"
  ECR_REPOSITORY: sample-war
  IMAGE_TAG: "1.0"

jobs:

  build-and-push:
    name: Build WAR, Docker Image and Push to ECR
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------
      # 1. Checkout source code
      # -----------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------
      # 2. Setup Java 21
      # -----------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # -----------------------------------
      # 3. Build WAR using Maven
      # -----------------------------------
      - name: Build WAR
        run: |
          mvn clean package -DskipTests

      # -----------------------------------
      # 4. Verify WAR
      # -----------------------------------
      - name: Verify WAR file
        run: |
          ls -lh target/
          test -f target/hello-world.war

      # -----------------------------------
      # 5. Configure AWS using OIDC
      # -----------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::022267197315:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------
      # 6. Verify AWS
      # -----------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # -----------------------------------
      # 7. Login to Amazon ECR
      # -----------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------
      # 8. Build Docker image
      # -----------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG .

      # -----------------------------------
      # 9. Push Docker image to ECR
      # -----------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
