name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "022267197315"
  ECR_REPOSITORY: sample-war
  EKS_CLUSTER_NAME: hello-world-eks
  NAMESPACE: sample-war

jobs:

  # ==========================================================
  # JOB 1: BUILD + DOCKER + ECR
  # ==========================================================

  build-and-push:

    name: Build WAR, Docker Image and Push to ECR

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout source code
      # ------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # AWS authentication using GitHub OIDC
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::022267197315:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # Verify AWS identity
      # ------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # Java 21
      # ------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ------------------------------------------------------
      # Build WAR
      # ------------------------------------------------------

      - name: Build WAR
        run: |
          mvn clean package -DskipTests

      # ------------------------------------------------------
      # Verify WAR
      # ------------------------------------------------------

      - name: Verify WAR
        run: |
          ls -lh target/
          test -f target/hello-world.war

      # ------------------------------------------------------
      # Login to ECR
      # ------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------
      # Build Docker image
      # ------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${GITHUB_SHA} \
            -t $ECR_REPOSITORY:latest \
            .

      # ------------------------------------------------------
      # Tag image for ECR
      # ------------------------------------------------------

      - name: Tag Docker image
        run: |

          docker tag \
            $ECR_REPOSITORY:${GITHUB_SHA} \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}

          docker tag \
            $ECR_REPOSITORY:latest \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest

      # ------------------------------------------------------
      # Push SHA image
      # ------------------------------------------------------

      - name: Push SHA image to ECR
        run: |
          docker push \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}

      # ------------------------------------------------------
      # Push latest image
      # ------------------------------------------------------

      - name: Push latest image to ECR
        run: |
          docker push \
            ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest


  # ==========================================================
  # JOB 2: DEPLOY TO EKS
  # ==========================================================

  deploy:

    name: Deploy to EKS using Helm

    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      # ------------------------------------------------------
      # Checkout source
      # ------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # AWS authentication using GitHub OIDC
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::022267197315:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # Verify AWS identity
      # ------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # Configure kubectl
      # ------------------------------------------------------

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # ------------------------------------------------------
      # Verify EKS access
      # ------------------------------------------------------

      - name: Verify EKS
        run: |
          kubectl get nodes
          kubectl get namespaces

      # ------------------------------------------------------
      # Install Helm
      # ------------------------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # ------------------------------------------------------
      # Helm lint
      # ------------------------------------------------------

      - name: Helm lint
        run: |
          helm lint helm/sample-war

      # ------------------------------------------------------
      # Helm deployment
      # ------------------------------------------------------

      - name: Deploy application with Helm
        run: |

          helm upgrade --install sample-war \
            helm/sample-war \
            --namespace $NAMESPACE \
            --create-namespace \
            --set image.repository=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY} \
            --set image.tag=${GITHUB_SHA} \
            --wait \
            --timeout 5m

      # ------------------------------------------------------
      # Verify deployment
      # ------------------------------------------------------

      - name: Verify Kubernetes deployment
        run: |

          echo "===== PODS ====="
          kubectl get pods -n $NAMESPACE

          echo "===== SERVICE ====="
          kubectl get svc -n $NAMESPACE

          echo "===== INGRESS ====="
          kubectl get ingress -n $NAMESPACE

          echo "===== DEPLOYMENT ====="
          kubectl get deployment -n $NAMESPACE
