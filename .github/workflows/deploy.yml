# ============================================================
# JOB 4 - DEPLOY MS1 TO PROD
# ============================================================

  deploy-prod:

    name: Deploy MS1 to PROD

    runs-on: ubuntu-latest

    needs:
      - deploy-qa

    environment:
      name: prod

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # AWS IDENTITY
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # VERIFY EKS
      # --------------------------------------------------------

      - name: Verify EKS cluster
        run: |
          echo "======================================"
          echo "VERIFYING EKS CLUSTER"
          echo "======================================"

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text


      # --------------------------------------------------------
      # CONFIGURE KUBECONFIG
      # --------------------------------------------------------

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"


      # --------------------------------------------------------
      # VERIFY NODES
      # --------------------------------------------------------

      - name: Verify EKS nodes
        run: |
          kubectl get nodes -o wide


      # --------------------------------------------------------
      # SETUP HELM
      # --------------------------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest


      # --------------------------------------------------------
      # HELM LINT
      # --------------------------------------------------------

      - name: Helm lint
        run: |
          helm lint "$HELM_CHART"


      # --------------------------------------------------------
      # HELM TEMPLATE VALIDATION
      # --------------------------------------------------------

      - name: Helm template validation
        run: |
          helm template "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace prod \
            -f "$HELM_CHART/values-prod.yaml" \
            --set image.repository="${{ needs.build-and-push.outputs.image_repository }}" \
            --set image.tag="${{ needs.build-and-push.outputs.image_tag }}"


      # --------------------------------------------------------
      # DEPLOY PROD
      # --------------------------------------------------------

      - name: Deploy MS1 to PROD
        run: |
          echo "======================================"
          echo "DEPLOYING MS1 TO PROD"
          echo "======================================"

          echo "Image:"
          echo "${{ needs.build-and-push.outputs.image_repository }}:${{ needs.build-and-push.outputs.image_tag }}"

          helm upgrade --install "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace prod \
            --create-namespace \
            -f "$HELM_CHART/values-prod.yaml" \
            --set image.repository="${{ needs.build-and-push.outputs.image_repository }}" \
            --set image.tag="${{ needs.build-and-push.outputs.image_tag }}" \
            --wait \
            --timeout 10m


      # --------------------------------------------------------
      # HELM STATUS
      # --------------------------------------------------------

      - name: Helm status PROD
        run: |
          helm status "$HELM_RELEASE" \
            --namespace prod


      # --------------------------------------------------------
      # ROLLOUT
      # --------------------------------------------------------

      - name: Check PROD rollout
        run: |
          kubectl rollout status \
            deployment/ms1-ms1 \
            -n prod \
            --timeout=5m


      # --------------------------------------------------------
      # VERIFY PROD
      # --------------------------------------------------------

      - name: Verify PROD deployment
        run: |
          echo "======================================"
          echo "PROD DEPLOYMENT STATUS"
          echo "======================================"

          kubectl get deployment -n prod
          kubectl get pods -n prod
          kubectl get svc -n prod
          kubectl get ingress -n prod

          echo "PROD deployment successful"


      # --------------------------------------------------------
      # WAIT FOR PROD ALB
      # --------------------------------------------------------

      - name: Wait for PROD ALB
        run: |

          echo "======================================"
          echo "WAITING FOR PROD ALB"
          echo "======================================"

          for i in {1..30}; do

            ALB=$(kubectl get ingress ms1-ms1 \
              -n prod \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$ALB" ]; then

              echo "======================================"
              echo "PROD ALB CREATED"
              echo "======================================"

              echo "ALB Hostname:"
              echo "$ALB"

              echo ""
              echo "Application URL:"
              echo "http://$ALB/hello-world/"

              exit 0
            fi

            echo "ALB not ready yet..."
            echo "Attempt: $i/30"

            sleep 20

          done

          echo "======================================"
          echo "PROD ALB CREATION FAILED/TIMED OUT"
          echo "======================================"

          kubectl describe ingress ms1-ms1 \
            -n prod

          exit 1


      # --------------------------------------------------------
      # FINAL PROD STATUS
      # --------------------------------------------------------

      - name: Final PROD status
        run: |

          echo ""
          echo "======================================"
          echo "FINAL MS1 PROD STATUS"
          echo "======================================"

          echo ""
          echo "===== DEPLOYMENT ====="
          kubectl get deployment -n prod

          echo ""
          echo "===== PODS ====="
          kubectl get pods -n prod

          echo ""
          echo "===== SERVICE ====="
          kubectl get svc -n prod

          echo ""
          echo "===== INGRESS ====="
          kubectl get ingress -n prod

          echo ""
          echo "===== HELM ====="
          helm list -n prod

          echo ""
          echo "======================================"
          echo "MS1 PROD DEPLOYMENT COMPLETED"
          echo "======================================"
