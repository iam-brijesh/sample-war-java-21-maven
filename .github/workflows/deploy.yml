name: MS1 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "helm/ms1/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: sample-war
  EKS_CLUSTER_NAME: hello-world-eks
  NAMESPACE: dev
  HELM_RELEASE: ms1
  HELM_CHART: ./helm/ms1

jobs:

  build-and-push:

    name: Build WAR and Push Docker Image

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build WAR
        run: |
          echo "======================================"
          echo "Building MS1 WAR"
          echo "======================================"

          mvn clean package -DskipTests

      - name: Verify WAR
        run: |
          echo "======================================"
          echo "VERIFY WAR"
          echo "======================================"

          ls -lh target/

          test -f target/hello-world.war

          echo "WAR successfully created"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .

      - name: Push SHA image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Push latest image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Verify ECR image
        env:
          IMAGE_TAG: ${{ github.sha }}

        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"


  deploy:

    name: Deploy MS1 to EKS DEV

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify EKS cluster
        run: |
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify EKS nodes
        run: |
          kubectl get nodes -o wide

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Verify Helm
        run: |
          helm version

      - name: Helm lint
        run: |
          helm lint "$HELM_CHART"

      - name: Helm template validation
        run: |
          helm template "$HELM_RELEASE" \
            "$HELM_CHART" \
            -f "$HELM_CHART/values-dev.yaml" \
            --set image.repository=test \
            --set image.tag=test

      - name: Get ECR registry
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

          echo "ECR Registry: $REGISTRY"

      - name: Deploy MS1
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          echo "======================================"
          echo "DEPLOYING MS1"
          echo "======================================"

          echo "Namespace : $NAMESPACE"
          echo "Release   : $HELM_RELEASE"
          echo "Chart     : $HELM_CHART"
          echo "Image     : $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          helm upgrade --install "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$HELM_CHART/values-dev.yaml" \
            --set image.repository="$REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      - name: Helm status
        run: |
          helm status "$HELM_RELEASE" \
            --namespace "$NAMESPACE"

      - name: Verify deployment
        run: |
          kubectl get deployment \
            -n "$NAMESPACE" \
            -o wide

      - name: Check rollout
        run: |
          kubectl rollout status \
            deployment/ms1-ms1 \
            -n "$NAMESPACE" \
            --timeout=5m

      - name: Verify pods
        run: |
          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide

      - name: Verify service
        run: |
          kubectl get svc \
            -n "$NAMESPACE"

      - name: Verify ingress
        run: |
          kubectl get ingress \
            -n "$NAMESPACE"

      - name: Wait for ALB
        run: |
          echo "======================================"
          echo "WAITING FOR AWS ALB"
          echo "======================================"

          for i in {1..30}; do

            ALB=$(kubectl get ingress ms1-ms1 \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$ALB" ]; then
              echo "======================================"
              echo "ALB CREATED"
              echo "======================================"
              echo "ALB Hostname:"
              echo "$ALB"
              echo ""
              echo "Application URL:"
              echo "http://$ALB/hello-world/"
              echo "======================================"

              exit 0
            fi

            echo "ALB not ready yet... Attempt: $i/30"

            sleep 20

          done

          echo "ALB creation timed out"

          kubectl describe ingress ms1-ms1 \
            -n "$NAMESPACE"

          exit 1

      - name: Final deployment status
        run: |
          echo "======================================"
          echo "FINAL MS1 DEPLOYMENT STATUS"
          echo "======================================"

          echo "===== DEPLOYMENT ====="
          kubectl get deployment -n "$NAMESPACE"

          echo "===== PODS ====="
          kubectl get pods -n "$NAMESPACE"

          echo "===== SERVICE ====="
          kubectl get svc -n "$NAMESPACE"

          echo "===== INGRESS ====="
          kubectl get ingress -n "$NAMESPACE"

          echo "===== HELM ====="
          helm list -n "$NAMESPACE"

          echo "======================================"
          echo "MS1 DEPLOYMENT COMPLETED"
          echo "======================================"
