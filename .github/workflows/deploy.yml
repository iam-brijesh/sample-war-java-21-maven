name: MS-1 CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: hello-world-eks
  ECR_REPOSITORY: ms-1
  NAMESPACE: dev

jobs:

  # ============================================================
  # 1. BUILD + TEST + DOCKER IMAGE + PUSH TO ECR
  # ============================================================
  build:
    name: Build and Push MS-1
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Java 21
      # --------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # --------------------------------------------------------
      # Build and test application
      # --------------------------------------------------------
      - name: Build with Maven
        run: |
          mvn clean package

      # --------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::453168420398:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Create image tag
      # --------------------------------------------------------
      - name: Set image tag
        id: image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      # --------------------------------------------------------
      # Push Docker image to ECR
      # --------------------------------------------------------
      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # --------------------------------------------------------
      # Show image
      # --------------------------------------------------------
      - name: Show image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          echo "Image pushed:"
          echo "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


  # ============================================================
  # 2. DEPLOY TO EKS DEV NAMESPACE
  # ============================================================
  deploy:
    name: Deploy MS-1 to DEV
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      # --------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::453168420398:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Install kubectl
      # --------------------------------------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # --------------------------------------------------------
      # Configure kubeconfig
      # --------------------------------------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # --------------------------------------------------------
      # Verify EKS cluster
      # --------------------------------------------------------
      - name: Verify EKS cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # --------------------------------------------------------
      # Create namespace if it does not exist
      # --------------------------------------------------------
      - name: Create dev namespace
        run: |
          kubectl create namespace $NAMESPACE \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # --------------------------------------------------------
      # Get ECR registry
      # --------------------------------------------------------
      - name: Get ECR registry
        id: ecr
        run: |
          REGISTRY=$(aws sts get-caller-identity \
            --query Account \
            --output text).dkr.ecr.${AWS_REGION}.amazonaws.com

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Deploy MS-1
      # --------------------------------------------------------
      - name: Deploy MS-1
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |

          kubectl -n $NAMESPACE create deployment ms-1 \
            --image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # --------------------------------------------------------
      # Configure replicas
      # --------------------------------------------------------
      - name: Scale MS-1
        run: |
          kubectl -n $NAMESPACE scale deployment ms-1 --replicas=2

      # --------------------------------------------------------
      # Expose MS-1 internally
      # --------------------------------------------------------
      - name: Create MS-1 service
        run: |
          kubectl -n $NAMESPACE expose deployment ms-1 \
            --name=ms-1 \
            --port=8080 \
            --target-port=8080 \
            --type=ClusterIP \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # --------------------------------------------------------
      # Wait for rollout
      # --------------------------------------------------------
      - name: Wait for deployment
        run: |
          kubectl -n $NAMESPACE rollout status \
            deployment/ms-1 \
            --timeout=300s

      # --------------------------------------------------------
      # Show deployment
      # --------------------------------------------------------
      - name: Verify MS-1
        run: |
          echo "======================================"
          echo "MS-1 Deployment"
          echo "======================================"

          kubectl -n $NAMESPACE get deployment ms-1

          echo ""
          echo "======================================"
          echo "MS-1 Pods"
          echo "======================================"

          kubectl -n $NAMESPACE get pods \
            -l app=ms-1

          echo ""
          echo "======================================"
          echo "MS-1 Service"
          echo "======================================"

          kubectl -n $NAMESPACE get service ms-1
