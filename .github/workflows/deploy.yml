name: MS1 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "helm/ms1/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::453168420398:role/GitHubActionsRole
  ECR_REPOSITORY: sample-war
  EKS_CLUSTER_NAME: hello-world-eks
  NAMESPACE: dev
  HELM_RELEASE: ms1
  HELM_CHART: ./helm/ms1

jobs:

  # ==========================================================
  # JOB 1 - BUILD + TEST + DOCKER + ECR
  # ==========================================================

  build-and-push:

    name: Build WAR and Push Docker Image

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # JAVA 21
      # --------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # --------------------------------------------------------
      # MAVEN BUILD
      # --------------------------------------------------------

      - name: Build WAR
        run: |
          echo "======================================"
          echo "BUILDING MS1 WAR"
          echo "======================================"

          mvn clean package -DskipTests

      # --------------------------------------------------------
      # VERIFY WAR
      # --------------------------------------------------------

      - name: Verify WAR
        run: |
          echo "======================================"
          echo "VERIFY WAR"
          echo "======================================"

          ls -lh target/

          test -f target/hello-world.war

          echo "WAR successfully created"

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # VERIFY AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity

      # --------------------------------------------------------
      # LOGIN ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # BUILD DOCKER
      # --------------------------------------------------------

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          echo "======================================"
          echo "DOCKER BUILD"
          echo "======================================"

          echo "Registry : $REGISTRY"
          echo "Repository : $ECR_REPOSITORY"
          echo "Tag : $IMAGE_TAG"

          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .

      # --------------------------------------------------------
      # PUSH SHA
      # --------------------------------------------------------

      - name: Push SHA image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # --------------------------------------------------------
      # PUSH LATEST
      # --------------------------------------------------------

      - name: Push latest image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:latest"

      # --------------------------------------------------------
      # VERIFY ECR
      # --------------------------------------------------------

      - name: Verify ECR image
        env:
          IMAGE_TAG: ${{ github.sha }}

        run: |
          echo "======================================"
          echo "VERIFY ECR IMAGE"
          echo "======================================"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

  # ==========================================================
  # JOB 2 - DEPLOY MS1 TO EKS DEV
  # ==========================================================

  deploy:

    name: Deploy MS1 to EKS DEV

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # VERIFY AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity

      # --------------------------------------------------------
      # VERIFY EKS
      # --------------------------------------------------------

      - name: Verify EKS cluster
        run: |
          echo "======================================"
          echo "EKS CLUSTER"
          echo "======================================"

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

      # --------------------------------------------------------
      # CONFIGURE KUBECONFIG
      # --------------------------------------------------------

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # --------------------------------------------------------
      # VERIFY NODES
      # --------------------------------------------------------

      - name: Verify EKS nodes
        run: |
          echo "======================================"
          echo "EKS NODES"
          echo "======================================"

          kubectl get nodes -o wide

      # --------------------------------------------------------
      # SETUP HELM
      # --------------------------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # --------------------------------------------------------
      # HELM VERSION
      # --------------------------------------------------------

      - name: Verify Helm
        run: |
          helm version

      # --------------------------------------------------------
      # HELM LINT
      # --------------------------------------------------------

      - name: Helm lint
        run: |
          echo "======================================"
          echo "HELM LINT"
          echo "======================================"

          helm lint "$HELM_CHART"

      # --------------------------------------------------------
      # HELM TEMPLATE
      # --------------------------------------------------------

      - name: Helm template validation
        run: |
          echo "======================================"
          echo "HELM TEMPLATE VALIDATION"
          echo "======================================"

          helm template "$HELM_RELEASE" \
            "$HELM_CHART" \
            -f "$HELM_CHART/values-dev.yaml" \
            --set image.repository=test \
            --set image.tag=test

      # --------------------------------------------------------
      # GET ECR REGISTRY
      # --------------------------------------------------------

      - name: Get ECR registry
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "ECR REGISTRY"
          echo "======================================"

          echo "$REGISTRY"

      # --------------------------------------------------------
      # DEPLOY MS1
      # --------------------------------------------------------

      - name: Deploy MS1 with Helm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          echo "======================================"
          echo "DEPLOYING MS1"
          echo "======================================"

          echo "Namespace : $NAMESPACE"
          echo "Release   : $HELM_RELEASE"
          echo "Chart     : $HELM_CHART"
          echo "Image     : $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          helm upgrade --install "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$HELM_CHART/values-dev.yaml" \
            --set image.repository="$REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      # --------------------------------------------------------
      # HELM STATUS
      # --------------------------------------------------------

      - name: Helm status
        run: |
          helm status "$HELM_RELEASE" \
            --namespace "$NAMESPACE"

      # --------------------------------------------------------
      # ROLLOUT
      # --------------------------------------------------------

      - name: Check rollout
        run: |
          kubectl rollout status \
            deployment/ms1-ms1 \
            -n "$NAMESPACE" \
            --timeout=5m

      # --------------------------------------------------------
      # VERIFY PODS
      # --------------------------------------------------------

      - name: Verify pods
        run: |
          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide

      # --------------------------------------------------------
      # VERIFY SERVICE
      # --------------------------------------------------------

      - name: Verify service
        run: |
          echo "======================================"
          echo "SERVICE"
          echo "======================================"

          kubectl get svc \
            -n "$NAMESPACE"

      # --------------------------------------------------------
      # VERIFY INGRESS
      # --------------------------------------------------------

      - name: Verify ingress
        run: |
          echo "======================================"
          echo "INGRESS"
          echo "======================================"

          kubectl get ingress \
            -n "$NAMESPACE"

      # --------------------------------------------------------
      # WAIT FOR ALB
      # --------------------------------------------------------

      - name: Wait for ALB
        run: |
          echo "======================================"
          echo "WAITING FOR AWS ALB"
          echo "======================================"

          for i in {1..30}; do

            ALB=$(kubectl get ingress ms1-ms1 \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$ALB" ]; then

              echo "======================================"
              echo "ALB CREATED"
              echo "======================================"

              echo "ALB Hostname:"
              echo "$ALB"

              echo ""
              echo "Application URL:"
              echo "http://$ALB/hello-world/"

              echo "======================================"

              exit 0
            fi

            echo "ALB not ready yet..."
            echo "Attempt: $i/30"

            sleep 20

          done

          echo "======================================"
          echo "ALB CREATION FAILED/TIMED OUT"
          echo "======================================"

          kubectl describe ingress ms1-ms1 \
            -n "$NAMESPACE"

          exit 1

      # --------------------------------------------------------
      # FINAL STATUS
      # --------------------------------------------------------

      - name: Final deployment status
        run: |
          echo ""
          echo "======================================"
          echo "FINAL MS1 DEPLOYMENT STATUS"
          echo "======================================"

          echo ""
          echo "===== DEPLOYMENT ====="
          kubectl get deployment -n "$NAMESPACE"

          echo ""
          echo "===== PODS ====="
          kubectl get pods -n "$NAMESPACE"

          echo ""
          echo "===== SERVICE ====="
          kubectl get svc -n "$NAMESPACE"

          echo ""
          echo "===== INGRESS ====="
          kubectl get ingress -n "$NAMESPACE"

          echo ""
          echo "===== HELM ====="
          helm list -n "$NAMESPACE"

          echo ""
          echo "======================================"
          echo "MS1 DEPLOYMENT COMPLETED"
          echo "======================================"
