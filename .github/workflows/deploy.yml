name: Application CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "helm/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: sample-war
  EKS_CLUSTER_NAME: hello-world-eks
  NAMESPACE: sample-war

jobs:

  # ==========================================================
  # JOB 1
  # BUILD WAR + DOCKER + PUSH ECR
  # ==========================================================

  build-and-push:

    name: Build WAR and Push Docker Image

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout source
        uses: actions/checkout@v4

      # ======================================================
      # JAVA 21
      # ======================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ======================================================
      # MAVEN
      # ======================================================

      - name: Build WAR
        run: |
          mvn clean package -DskipTests

      # ======================================================
      # VERIFY WAR
      # ======================================================

      - name: Verify WAR
        run: |
          echo "===== TARGET ====="

          ls -lh target/

          test -f target/hello-world.war

          echo "WAR successfully created"

      # ======================================================
      # AWS OIDC
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::022267197315:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ======================================================
      # AWS ACCOUNT
      # ======================================================

      - name: Get AWS Account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      # ======================================================
      # ECR LOGIN
      # ======================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ======================================================
      # DOCKER BUILD
      # ======================================================

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .

      # ======================================================
      # PUSH SHA
      # ======================================================

      - name: Push SHA image
        env:
          REGISTRY: ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # ======================================================
      # PUSH LATEST
      # ======================================================

      - name: Push latest image
        env:
          REGISTRY: ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:latest"


  # ==========================================================
  # JOB 2
  # DEPLOY TO EKS
  # ==========================================================

  deploy:

    name: Deploy Application to EKS

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout source
        uses: actions/checkout@v4

      # ======================================================
      # AWS OIDC
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::022267197315:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ======================================================
      # CONFIGURE KUBECTL
      # ======================================================

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # ======================================================
      # VERIFY EKS
      # ======================================================

      - name: Verify EKS
        run: |
          echo "===== CLUSTER ====="

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

          echo "===== NODES ====="

          kubectl get nodes

      # ======================================================
      # HELM
      # ======================================================

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # ======================================================
      # HELM LINT
      # ======================================================

      - name: Helm lint
        run: |
          helm lint helm/sample-war

      # ======================================================
      # AWS ACCOUNT
      # ======================================================

      - name: Get AWS Account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      # ======================================================
      # DEPLOY
      # ======================================================

      - name: Deploy application with Helm
        env:
          REGISTRY: ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}

        run: |
          helm upgrade --install sample-war \
            helm/sample-war \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="$REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      # ======================================================
      # VERIFY PODS
      # ======================================================

      - name: Verify pods
        run: |
          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide

      # ======================================================
      # VERIFY SERVICE
      # ======================================================

      - name: Verify service
        run: |
          kubectl get svc \
            -n "$NAMESPACE"

      # ======================================================
      # VERIFY INGRESS
      # ======================================================

      - name: Verify ingress
        run: |
          kubectl get ingress \
            -n "$NAMESPACE"

      # ======================================================
      # WAIT FOR ALB
      # ======================================================

      - name: Wait for ALB
        run: |
          echo "Waiting for AWS ALB..."

          for i in {1..30}; do

            ALB=$(kubectl get ingress sample-war \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$ALB" ]; then
              echo "======================================"
              echo "ALB CREATED"
              echo "======================================"
              echo "http://$ALB"
              echo "======================================"
              exit 0
            fi

            echo "ALB not ready yet..."
            sleep 20

          done

          echo "ALB was not created within expected time"
          kubectl describe ingress sample-war -n "$NAMESPACE"
          exit 1

      # ======================================================
      # FINAL STATUS
      # ======================================================

      - name: Final deployment status
        run: |
          echo "======================================"
          echo "DEPLOYMENT"
          echo "======================================"

          kubectl get deployment \
            -n "$NAMESPACE"

          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods \
            -n "$NAMESPACE"

          echo "======================================"
          echo "SERVICE"
          echo "======================================"

          kubectl get svc \
            -n "$NAMESPACE"

          echo "======================================"
          echo "INGRESS"
          echo "======================================"

          kubectl get ingress \
            -n "$NAMESPACE"

          echo "======================================"
          echo "HELM"
          echo "======================================"

          helm list \
            -n "$NAMESPACE"
