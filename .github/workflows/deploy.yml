name: MS1 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "helm/ms1/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::453168420398:role/GitHubActionsRole
  AWS_ACCOUNT_ID: "453168420398"
  ECR_REGISTRY: 453168420398.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: ms-1
  EKS_CLUSTER_NAME: hello-world-eks
  HELM_RELEASE: ms1
  HELM_CHART: ./helm/ms1


# ============================================================
# JOBS
# ============================================================

jobs:

  # ============================================================
  # JOB 1 - BUILD + TEST + DOCKER + ECR
  # ============================================================

  build-and-push:

    name: Build MS1 and Push Image to ECR

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # JAVA 21
      # --------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # --------------------------------------------------------
      # MAVEN BUILD
      # --------------------------------------------------------

      - name: Build WAR
        run: |
          echo "======================================"
          echo "BUILDING MS1 WAR"
          echo "======================================"

          mvn clean package -DskipTests


      # --------------------------------------------------------
      # VERIFY WAR
      # --------------------------------------------------------

      - name: Verify WAR
        run: |
          echo "======================================"
          echo "VERIFY WAR"
          echo "======================================"

          ls -lh target/

          test -f target/hello-world.war

          echo "WAR successfully created"


      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # VERIFY AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity


      # --------------------------------------------------------
      # LOGIN ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # VERIFY ECR REPOSITORY
      # --------------------------------------------------------

      - name: Verify ECR repository
        run: |
          echo "======================================"
          echo "VERIFY ECR REPOSITORY"
          echo "======================================"

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

          echo "ECR repository verified"


      # --------------------------------------------------------
      # DOCKER BUILD
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          echo "======================================"
          echo "DOCKER BUILD"
          echo "======================================"

          echo "Registry   : $ECR_REGISTRY"
          echo "Repository : $ECR_REPOSITORY"
          echo "Tag        : $GITHUB_SHA"

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            .


      # --------------------------------------------------------
      # PUSH IMAGE TO ECR
      # --------------------------------------------------------

      - name: Push Docker image
        run: |
          echo "======================================"
          echo "PUSHING IMAGE TO ECR"
          echo "======================================"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"


      # --------------------------------------------------------
      # VERIFY IMAGE
      # --------------------------------------------------------

      - name: Verify ECR image
        run: |
          echo "======================================"
          echo "VERIFY ECR IMAGE"
          echo "======================================"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION"

          echo ""
          echo "IMAGE:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          echo "ECR image verified successfully"


  # ============================================================
  # JOB 2 - DEPLOY DEV
  # ============================================================

  deploy-dev:

    name: Deploy MS1 to DEV

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    environment:
      name: dev

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # VERIFY AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # VERIFY ECR IMAGE
      # --------------------------------------------------------

      - name: Verify deployment image
        run: |
          echo "======================================"
          echo "DEV IMAGE"
          echo "======================================"

          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION"


      # --------------------------------------------------------
      # EKS
      # --------------------------------------------------------

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"


      # --------------------------------------------------------
      # VERIFY EKS
      # --------------------------------------------------------

      - name: Verify EKS
        run: |
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

          kubectl get nodes -o wide


      # --------------------------------------------------------
      # HELM
      # --------------------------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest


      - name: Helm lint
        run: |
          helm lint "$HELM_CHART"


      # --------------------------------------------------------
      # HELM TEMPLATE
      # --------------------------------------------------------

      - name: Validate DEV Helm template
        run: |
          helm template "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace dev \
            -f "$HELM_CHART/values-dev.yaml" \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$GITHUB_SHA"


      # --------------------------------------------------------
      # DEPLOY DEV
      # --------------------------------------------------------

      - name: Deploy MS1 to DEV
        run: |
          echo "======================================"
          echo "DEPLOYING MS1 TO DEV"
          echo "======================================"

          echo "Namespace : dev"
          echo "Release   : $HELM_RELEASE"
          echo "Image     : $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          helm upgrade --install "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace dev \
            --create-namespace \
            -f "$HELM_CHART/values-dev.yaml" \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$GITHUB_SHA" \
            --wait \
            --timeout 10m


      # --------------------------------------------------------
      # ROLLOUT
      # --------------------------------------------------------

      - name: Check DEV rollout
        run: |
          kubectl rollout status \
            deployment/ms1-ms1 \
            -n dev \
            --timeout=5m


      # --------------------------------------------------------
      # VERIFY DEV
      # --------------------------------------------------------

      - name: Verify DEV
        run: |
          kubectl get deployment -n dev
          kubectl get pods -n dev
          kubectl get svc -n dev
          kubectl get ingress -n dev

          echo "DEV deployment successful"


  # ============================================================
  # JOB 3 - DEPLOY QA
  # ============================================================

  deploy-qa:

    name: Deploy MS1 to QA

    runs-on: ubuntu-latest

    needs:
      - deploy-dev

    environment:
      name: qa

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # VERIFY IMAGE
      # --------------------------------------------------------

      - name: Verify deployment image
        run: |
          echo "======================================"
          echo "QA IMAGE"
          echo "======================================"

          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION"


      # --------------------------------------------------------
      # EKS
      # --------------------------------------------------------

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"


      - name: Verify EKS
        run: |
          kubectl get nodes -o wide


      # --------------------------------------------------------
      # HELM
      # --------------------------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest


      - name: Helm lint
        run: |
          helm lint "$HELM_CHART"


      # --------------------------------------------------------
      # HELM TEMPLATE
      # --------------------------------------------------------

      - name: Validate QA Helm template
        run: |
          helm template "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace qa \
            -f "$HELM_CHART/values-qa.yaml" \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$GITHUB_SHA"


      # --------------------------------------------------------
      # DEPLOY QA
      # --------------------------------------------------------

      - name: Deploy MS1 to QA
        run: |
          echo "======================================"
          echo "DEPLOYING MS1 TO QA"
          echo "======================================"
[O
          echo "Namespace : qa"
          echo "Release   : $HELM_RELEASE"
          echo "Image     : $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          helm upgrade --install "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace qa \
            --create-namespace \
            -f "$HELM_CHART/values-qa.yaml" \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$GITHUB_SHA" \
            --wait \
            --timeout 10m


      # --------------------------------------------------------
      # ROLLOUT
      # --------------------------------------------------------

      - name: Check QA rollout
        run: |
          kubectl rollout status \
            deployment/ms1-ms1 \
            -n qa \
            --timeout=5m


      # --------------------------------------------------------
      # VERIFY QA
      # --------------------------------------------------------

      - name: Verify QA
        run: |
          kubectl get deployment -n qa
          kubectl get pods -n qa
          kubectl get svc -n qa
          kubectl get ingress -n qa

          echo "QA deployment successful"


  # ============================================================
  # JOB 4 - DEPLOY PROD
  # ============================================================

  deploy-prod:

    name: Deploy MS1 to PROD

    runs-on: ubuntu-latest

    needs:
      - deploy-qa

    environment:
      name: prod

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # VERIFY IMAGE
      # --------------------------------------------------------

      - name: Verify deployment image
        run: |
          echo "======================================"
          echo "PROD IMAGE"
          echo "======================================"

          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION"


      # --------------------------------------------------------
      # EKS
      # --------------------------------------------------------

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"


      - name: Verify EKS
        run: |
          kubectl get nodes -o wide


      # --------------------------------------------------------
      # HELM
      # --------------------------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest


      - name: Helm lint
        run: |
          helm lint "$HELM_CHART"


      # --------------------------------------------------------
      # HELM TEMPLATE
      # --------------------------------------------------------

      - name: Validate PROD Helm template
        run: |
          helm template "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace prod \
            -f "$HELM_CHART/values-prod.yaml" \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$GITHUB_SHA"


      # --------------------------------------------------------
      # DEPLOY PROD
      # --------------------------------------------------------

      - name: Deploy MS1 to PROD
        run: |
          echo "======================================"
          echo "DEPLOYING MS1 TO PROD"
          echo "======================================"

          echo "Namespace : prod"
          echo "Release   : $HELM_RELEASE"
          echo "Image     : $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          helm upgrade --install "$HELM_RELEASE" \
            "$HELM_CHART" \
            --namespace prod \
            --create-namespace \
            -f "$HELM_CHART/values-prod.yaml" \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$GITHUB_SHA" \
            --wait \
            --timeout 10m


      # --------------------------------------------------------
      # ROLLOUT
      # --------------------------------------------------------

      - name: Check PROD rollout
        run: |
          kubectl rollout status \
            deployment/ms1-ms1 \
            -n prod \
            --timeout=5m


      # --------------------------------------------------------
      # VERIFY PROD
      # --------------------------------------------------------

      - name: Verify PROD
        run: |
          echo "======================================"
          echo "PROD DEPLOYMENT STATUS"
          echo "======================================"

          kubectl get deployment -n prod
          kubectl get pods -n prod
          kubectl get svc -n prod
          kubectl get ingress -n prod

          echo "PROD deployment successful"


      # --------------------------------------------------------
      # WAIT FOR PROD ALB
      # --------------------------------------------------------

      - name: Wait for PROD ALB
        run: |

          echo "======================================"
          echo "WAITING FOR PROD ALB"
          echo "======================================"

          for i in {1..30}; do

            ALB=$(kubectl get ingress ms1-ms1 \
              -n prod \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$ALB" ]; then

              echo "======================================"
              echo "PROD ALB CREATED"
              echo "======================================"

              echo "ALB Hostname:"
              echo "$ALB"

              echo ""
              echo "Application URL:"
              echo "http://$ALB/hello-world/"

              exit 0
            fi

            echo "ALB not ready yet..."
            echo "Attempt: $i/30"

            sleep 20

          done

          echo "======================================"
          echo "PROD ALB CREATION FAILED/TIMED OUT"
          echo "======================================"

          kubectl describe ingress ms1-ms1 \
            -n prod

          exit 1


      # --------------------------------------------------------
      # FINAL STATUS
      # --------------------------------------------------------

      - name: Final PROD status
        run: |

          echo ""
          echo "======================================"
          echo "FINAL MS1 PROD STATUS"
          echo "======================================"

          echo ""
          echo "===== DEPLOYMENT ====="
          kubectl get deployment -n prod

          echo ""
          echo "===== PODS ====="
          kubectl get pods -n prod

          echo ""
          echo "===== SERVICE ====="
          kubectl get svc -n prod

          echo ""
          echo "===== INGRESS ====="
          kubectl get ingress -n prod

          echo ""
          echo "===== HELM ====="
          helm list -n prod

          echo ""
          echo "======================================"
          echo "MS1 PROD DEPLOYMENT COMPLETED"
          echo "======================================"
