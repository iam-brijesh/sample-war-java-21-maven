name: Application CI/CD - Build and Deploy to EKS

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "helm/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: sample-war
  EKS_CLUSTER_NAME: hello-world-eks
  NAMESPACE: sample-war

jobs:

  # ==========================================================
  # JOB 1: BUILD + DOCKER + ECR
  # ==========================================================

  build-and-push:

    name: Build WAR, Docker Image and Push to ECR

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Java 21
      # ------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ------------------------------------------------------
      # Maven Build
      # ------------------------------------------------------

      - name: Build WAR
        run: |
          mvn clean package -DskipTests

      # ------------------------------------------------------
      # Verify WAR
      # ------------------------------------------------------

      - name: Verify WAR
        run: |
          echo "===== TARGET DIRECTORY ====="
          ls -lh target/

          test -f target/hello-world.war

          echo "WAR file found successfully"

      # ------------------------------------------------------
      # AWS OIDC
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # Verify AWS
      # ------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # Get AWS Account ID
      # ------------------------------------------------------

      - name: Get AWS Account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------
      # Login to ECR
      # ------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------
      # Docker Build
      # ------------------------------------------------------

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$ECR_REPOSITORY:latest \
            .

      # ------------------------------------------------------
      # Push SHA image
      # ------------------------------------------------------

      - name: Push SHA image to ECR
        env:
          REGISTRY: ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ------------------------------------------------------
      # Push latest image
      # ------------------------------------------------------

      - name: Push latest image to ECR
        env:
          REGISTRY: ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:latest


  # ==========================================================
  # JOB 2: DEPLOY TO EKS
  # ==========================================================

  deploy:

    name: Deploy Application to EKS using Helm

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # AWS OIDC
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------
      # Verify AWS
      # ------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # Configure kubectl
      # ------------------------------------------------------

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # ------------------------------------------------------
      # Verify EKS
      # ------------------------------------------------------

      - name: Verify EKS access
        run: |
          echo "===== EKS NODES ====="
          kubectl get nodes

          echo "===== NAMESPACES ====="
          kubectl get namespaces

      # ------------------------------------------------------
      # Install Helm
      # ------------------------------------------------------

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # ------------------------------------------------------
      # Helm Lint
      # ------------------------------------------------------

      - name: Helm lint
        run: |
          helm lint helm/sample-war

      # ------------------------------------------------------
      # Get AWS Account ID
      # ------------------------------------------------------

      - name: Get AWS Account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------
      # Deploy with Helm
      # ------------------------------------------------------

      - name: Deploy application with Helm
        env:
          REGISTRY: ${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}

        run: |
          helm upgrade --install sample-war \
            helm/sample-war \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="$REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      # ------------------------------------------------------
      # Verify Deployment
      # ------------------------------------------------------

      - name: Verify Kubernetes deployment
        run: |

          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide

          echo "======================================"
          echo "SERVICE"
          echo "======================================"

          kubectl get svc \
            -n "$NAMESPACE"

          echo "======================================"
          echo "INGRESS"
          echo "======================================"

          kubectl get ingress \
            -n "$NAMESPACE"

          echo "======================================"
          echo "DEPLOYMENT"
          echo "======================================"

          kubectl get deployment \
            -n "$NAMESPACE"

          echo "======================================"
          echo "HELM"
          echo "======================================"

          helm list \
            -n "$NAMESPACE"
