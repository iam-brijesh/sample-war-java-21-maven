name: Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yml"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "022267197315"
  EKS_CLUSTER_NAME: hello-world-eks
  ECR_REPOSITORY: sample-war
  TF_WORKING_DIR: terraform

jobs:

  terraform:
    name: Create AWS Infrastructure
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ======================================================
      # AWS OIDC
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::022267197315:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS identity
        run: |
          set -e

          echo "=========================================="
          echo "AWS Identity"
          echo "=========================================="

          aws sts get-caller-identity

          echo "=========================================="
          echo "AWS Region"
          echo "=========================================="

          echo "$AWS_REGION"

      # ======================================================
      # CHECK AWS RESOURCES
      # ======================================================

      - name: Check existing AWS resources
        run: |
          set -e

          echo "=========================================="
          echo "Checking existing AWS resources"
          echo "=========================================="

          echo ""
          echo "===== ECR REPOSITORY ====="

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "ECR repository exists: $ECR_REPOSITORY"

          else

            echo "ECR repository does not exist."

          fi

          echo ""
          echo "===== KMS ALIAS ====="

          if aws kms describe-alias \
            --alias-name "alias/eks/$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "KMS alias exists: alias/eks/$EKS_CLUSTER_NAME"

          else

            echo "KMS alias does not exist."

          fi

          echo ""
          echo "===== CLOUDWATCH LOG GROUP ====="

          if aws logs describe-log-groups \
            --log-group-name-prefix "/aws/eks/$EKS_CLUSTER_NAME/cluster" \
            --region "$AWS_REGION" \
            --query "logGroups[?logGroupName=='/aws/eks/$EKS_CLUSTER_NAME/cluster'].logGroupName" \
            --output text | grep -q "/aws/eks/$EKS_CLUSTER_NAME/cluster"; then

            echo "CloudWatch log group exists."

          else

            echo "CloudWatch log group does not exist."

          fi

          echo ""
          echo "===== VPC COUNT ====="

          VPC_COUNT=$(aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --query 'length(Vpcs)' \
            --output text)

          echo "Current VPC count: $VPC_COUNT"

      # ======================================================
      # TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # ======================================================
      # TERRAFORM INIT
      # ======================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          terraform init -input=false

      # ======================================================
      # TERRAFORM VERSION
      # ======================================================

      - name: Terraform Version
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform version

      # ======================================================
      # TERRAFORM STATE
      # ======================================================

      - name: Show Terraform State
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "Terraform State"
          echo "=========================================="

          if terraform state list >/tmp/terraform_state.txt 2>/dev/null; then

            if [ -s /tmp/terraform_state.txt ]; then
              cat /tmp/terraform_state.txt
            else
              echo "Terraform state exists but contains no resources."
            fi

          else
            echo "No Terraform state currently exists."
          fi

      # ======================================================
      # IMPORT EXISTING AWS RESOURCES
      # ======================================================

      - name: Import existing AWS resources
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "IMPORT EXISTING AWS RESOURCES"
          echo "=========================================="

          # --------------------------------------------------
          # Function: check Terraform state
          # --------------------------------------------------

          resource_in_state() {
            terraform state list 2>/dev/null \
              | grep -Fxq "$1"
          }

          # --------------------------------------------------
          # ECR
          # --------------------------------------------------

          ECR_ADDRESS='aws_ecr_repository.sample_war'

          if resource_in_state "$ECR_ADDRESS"; then

            echo "ECR already exists in Terraform state."

          else

            if aws ecr describe-repositories \
              --repository-names "$ECR_REPOSITORY" \
              --region "$AWS_REGION" >/dev/null 2>&1; then

              echo "Importing existing ECR repository: $ECR_REPOSITORY"

              terraform import \
                "$ECR_ADDRESS" \
                "$ECR_REPOSITORY"

            else

              echo "ECR repository does not exist. Terraform will create it."

            fi

          fi

          # --------------------------------------------------
          # KMS ALIAS
          # --------------------------------------------------

          KMS_ADDRESS='module.eks.module.kms.aws_kms_alias.this["cluster"]'

          if resource_in_state "$KMS_ADDRESS"; then

            echo "KMS alias already exists in Terraform state."

          else

            if aws kms describe-alias \
              --alias-name "alias/eks/$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" >/dev/null 2>&1; then

              echo "Importing existing KMS alias: alias/eks/$EKS_CLUSTER_NAME"

              terraform import \
                "$KMS_ADDRESS" \
                "alias/eks/$EKS_CLUSTER_NAME"

            else

              echo "KMS alias does not exist. Terraform will create it."

            fi

          fi

          # --------------------------------------------------
          # CLOUDWATCH LOG GROUP
          # --------------------------------------------------

          LOG_GROUP_ADDRESS='module.eks.aws_cloudwatch_log_group.this[0]'

          if resource_in_state "$LOG_GROUP_ADDRESS"; then

            echo "CloudWatch log group already exists in Terraform state."

          else

            if aws logs describe-log-groups \
              --log-group-name-prefix "/aws/eks/$EKS_CLUSTER_NAME/cluster" \
              --region "$AWS_REGION" \
              --query "logGroups[?logGroupName=='/aws/eks/$EKS_CLUSTER_NAME/cluster'].logGroupName" \
              --output text \
              | grep -q "/aws/eks/$EKS_CLUSTER_NAME/cluster"; then

              echo "Importing existing CloudWatch log group."

              terraform import \
                "$LOG_GROUP_ADDRESS" \
                "/aws/eks/$EKS_CLUSTER_NAME/cluster"

            else

              echo "CloudWatch log group does not exist. Terraform will create it."

            fi

          fi

          # --------------------------------------------------
          # FINAL STATE
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "Terraform State After Import"
          echo "=========================================="

          terraform state list || true

      # ======================================================
      # TERRAFORM FORMAT
      # ======================================================

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          terraform fmt -check -recursive

      # ======================================================
      # TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          terraform validate

      # ======================================================
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          terraform plan \
            -input=false \
            -out=tfplan

      # ======================================================
      # TERRAFORM APPLY
      # ======================================================

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ======================================================
      # CONFIGURE KUBECTL
      # ======================================================

      - name: Configure kubeconfig
        if: github.event_name != 'pull_request'
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # ======================================================
      # VERIFY EKS
      # ======================================================

      - name: Verify EKS
        if: github.event_name != 'pull_request'
        run: |
          set -e

          echo "=========================================="
          echo "EKS CLUSTER"
          echo "=========================================="

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

          echo ""
          echo "=========================================="
          echo "EKS NODES"
          echo "=========================================="

          kubectl get nodes

      # ======================================================
      # SETUP HELM
      # ======================================================

      - name: Setup Helm
        if: github.event_name != 'pull_request'
        uses: azure/setup-helm@v4
        with:
          version: latest

      # ======================================================
      # ADD AWS EKS HELM REPOSITORY
      # ======================================================

      - name: Add EKS Helm repository
        if: github.event_name != 'pull_request'
        run: |
          set -e

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

      # ======================================================
      # INSTALL AWS LOAD BALANCER CONTROLLER
      # ======================================================

      - name: Install AWS Load Balancer Controller
        if: github.event_name != 'pull_request'
        run: |
          set -e

          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version 1.14.0 \
            --set clusterName="$EKS_CLUSTER_NAME" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --wait \
            --timeout 10m

      # ======================================================
      # VERIFY AWS LOAD BALANCER CONTROLLER
      # ======================================================

      - name: Verify AWS Load Balancer Controller
        if: github.event_name != 'pull_request'
        run: |
          set -e

          echo "=========================================="
          echo "SERVICE ACCOUNT"
          echo "=========================================="

          kubectl get serviceaccount \
            aws-load-balancer-controller \
            -n kube-system

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT"
          echo "=========================================="

          kubectl get deployment \
            aws-load-balancer-controller \
            -n kube-system

          echo ""
          echo "=========================================="
          echo "PODS"
          echo "=========================================="

          kubectl get pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller

      # ======================================================
      # FINAL TERRAFORM STATE
      # ======================================================

      - name: Final Terraform State
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "FINAL TERRAFORM STATE"
          echo "=========================================="

          terraform state list || true
