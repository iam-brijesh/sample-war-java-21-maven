name: Create AWS Infrastructure

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform

jobs:

  # ============================================================
  # TERRAFORM INFRASTRUCTURE
  # ============================================================

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Checkout source code
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Configure AWS using GitHub OIDC
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::022267197315:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------------------------
      # 3. Verify AWS authentication
      # ----------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
          aws eks describe-cluster \
            --name hello-world-eks \
            --region $AWS_REGION \
            --query 'cluster.{Name:name,Version:version,Status:status}' \
            --output table


      # ----------------------------------------------------------
      # 4. Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ----------------------------------------------------------
      # 5. Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false


      # ----------------------------------------------------------
      # 6. Terraform Format
      # ----------------------------------------------------------

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive


      # ----------------------------------------------------------
      # 7. Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate


      # ----------------------------------------------------------
      # 8. Terraform Plan
      # ----------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan


      # ----------------------------------------------------------
      # 9. Terraform Apply
      # ----------------------------------------------------------

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan


      # ----------------------------------------------------------
      # 10. Terraform Outputs
      # ----------------------------------------------------------

      - name: Terraform Outputs
        if: success()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform output
