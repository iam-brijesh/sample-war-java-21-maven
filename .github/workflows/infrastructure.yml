name: Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yml"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: hello-world-eks
  TF_WORKING_DIR: terraform

jobs:

  terraform:
    name: Create AWS Infrastructure
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ======================================================
      # AWS OIDC
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::022267197315:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ======================================================
      # TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      # ======================================================
      # IMPORT EXISTING AWS RESOURCES
      # ======================================================

      - name: Import existing AWS resources
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "Terraform State Before Import"
          echo "=========================================="

          terraform state list || true

          # --------------------------------------------------
          # ECR REPOSITORY
          # --------------------------------------------------

          if terraform state list | grep -Fxq 'aws_ecr_repository.sample_war'; then
            echo "ECR repository already exists in Terraform state."
          else
            echo "Importing existing ECR repository: sample-war"

            terraform import \
              aws_ecr_repository.sample_war \
              sample-war || true
          fi

          # --------------------------------------------------
          # KMS ALIAS
          # --------------------------------------------------

          if terraform state list | grep -Fxq 'module.eks.module.kms.aws_kms_alias.this["cluster"]'; then
            echo "KMS alias already exists in Terraform state."
          else
            echo "Importing existing KMS alias: alias/eks/hello-world-eks"

            terraform import \
              'module.eks.module.kms.aws_kms_alias.this["cluster"]' \
              alias/eks/hello-world-eks || true
          fi

          # --------------------------------------------------
          # CLOUDWATCH LOG GROUP
          # --------------------------------------------------

          if terraform state list | grep -Fxq 'module.eks.aws_cloudwatch_log_group.this[0]'; then
            echo "CloudWatch log group already exists in Terraform state."
          else
            echo "Importing existing CloudWatch log group"

            terraform import \
              'module.eks.aws_cloudwatch_log_group.this[0]' \
              '/aws/eks/hello-world-eks/cluster' || true
          fi

          echo "=========================================="
          echo "Terraform State After Import"
          echo "=========================================="

          terraform state list

      # ======================================================
      # TERRAFORM FORMAT
      # ======================================================

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      # ======================================================
      # TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # ======================================================
      # PLAN
      # ======================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan

      # ======================================================
      # APPLY
      # ======================================================

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve

      # ======================================================
      # CONFIGURE KUBECTL
      # ======================================================

      - name: Configure kubeconfig
        if: github.event_name != 'pull_request'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # ======================================================
      # VERIFY EKS
      # ======================================================

      - name: Verify EKS
        if: github.event_name != 'pull_request'
        run: |
          echo "===== EKS CLUSTER ====="

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

          echo "===== NODES ====="

          kubectl get nodes

      # ======================================================
      # HELM
      # ======================================================

      - name: Setup Helm
        if: github.event_name != 'pull_request'
        uses: azure/setup-helm@v4
        with:
          version: latest

      # ======================================================
      # AWS EKS HELM REPOSITORY
      # ======================================================

      - name: Add EKS Helm repository
        if: github.event_name != 'pull_request'
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

      # ======================================================
      # LOAD BALANCER CONTROLLER
      # ======================================================

      - name: Install AWS Load Balancer Controller
        if: github.event_name != 'pull_request'
        run: |
          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version 1.14.0 \
            --set clusterName="$EKS_CLUSTER_NAME" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --wait \
            --timeout 10m

      # ======================================================
      # VERIFY LOAD BALANCER CONTROLLER
      # ======================================================

      - name: Verify AWS Load Balancer Controller
        if: github.event_name != 'pull_request'
        run: |
          echo "===== SERVICE ACCOUNT ====="

          kubectl get serviceaccount \
            aws-load-balancer-controller \
            -n kube-system

          echo "===== DEPLOYMENT ====="

          kubectl get deployment \
            aws-load-balancer-controller \
            -n kube-system

          echo "===== PODS ====="

          kubectl get pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller
