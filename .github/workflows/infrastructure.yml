name: Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yml"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "022267197315"
  EKS_CLUSTER_NAME: hello-world-eks
  ECR_REPOSITORY: sample-war
  TF_WORKING_DIR: terraform

jobs:

  terraform:
    name: Create AWS Infrastructure
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ======================================================
      # AWS OIDC
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::022267197315:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS identity
        run: |
          set -e

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

          echo ""
          echo "AWS REGION:"
          echo "$AWS_REGION"

      # ======================================================
      # SETUP TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # ======================================================
      # TERRAFORM VERSION
      # ======================================================

      - name: Terraform Version
        run: |
          terraform version

      # ======================================================
      # TERRAFORM INIT
      # ======================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "TERRAFORM INIT"
          echo "=========================================="

          terraform init -input=false

      # ======================================================
      # SHOW TERRAFORM BACKEND
      # ======================================================

      - name: Verify Terraform State
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "TERRAFORM STATE BEFORE IMPORT"
          echo "=========================================="

          if terraform state list > /tmp/terraform_state.txt 2>/dev/null; then

            if [ -s /tmp/terraform_state.txt ]; then
              cat /tmp/terraform_state.txt
            else
              echo "Terraform state exists but contains no resources."
            fi

          else

            echo "No Terraform resources currently exist in state."

          fi

      # ======================================================
      # CHECK EXISTING AWS RESOURCES
      # ======================================================

      - name: Check existing AWS resources
        run: |
          set -e

          echo "=========================================="
          echo "CHECK EXISTING AWS RESOURCES"
          echo "=========================================="

          # --------------------------------------------------
          # ECR
          # --------------------------------------------------

          echo ""
          echo "===== ECR REPOSITORY ====="

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "ECR repository EXISTS:"
            echo "$ECR_REPOSITORY"

          else

            echo "ECR repository does NOT exist."

          fi

          # --------------------------------------------------
          # KMS
          # --------------------------------------------------

          echo ""
          echo "===== KMS ALIAS ====="

          if aws kms describe-alias \
            --alias-name "alias/eks/$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "KMS alias EXISTS:"
            echo "alias/eks/$EKS_CLUSTER_NAME"

          else

            echo "KMS alias does NOT exist."

          fi

          # --------------------------------------------------
          # CLOUDWATCH
          # --------------------------------------------------

          echo ""
          echo "===== CLOUDWATCH LOG GROUP ====="

          if aws logs describe-log-groups \
            --log-group-name-prefix "/aws/eks/$EKS_CLUSTER_NAME/cluster" \
            --region "$AWS_REGION" \
            --query "logGroups[?logGroupName=='/aws/eks/$EKS_CLUSTER_NAME/cluster'].logGroupName" \
            --output text \
            | grep -q "/aws/eks/$EKS_CLUSTER_NAME/cluster"; then

            echo "CloudWatch log group EXISTS."

          else

            echo "CloudWatch log group does NOT exist."

          fi

          # --------------------------------------------------
          # VPC COUNT
          # --------------------------------------------------

          echo ""
          echo "===== VPC COUNT ====="

          VPC_COUNT=$(aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --query 'length(Vpcs)' \
            --output text)

          echo "Current VPC count: $VPC_COUNT"

      # ======================================================
      # IMPORT EXISTING AWS RESOURCES
      # ======================================================

      - name: Import existing AWS resources
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "IMPORT EXISTING AWS RESOURCES"
          echo "=========================================="

          # ==================================================
          # FUNCTION: CHECK TERRAFORM STATE
          # ==================================================

          resource_in_state() {
            terraform state list 2>/dev/null \
              | grep -Fxq "$1"
          }

          # ==================================================
          # ECR REPOSITORY
          # ==================================================

          ECR_ADDRESS='aws_ecr_repository.sample_war'

          echo ""
          echo "=========================================="
          echo "ECR IMPORT"
          echo "=========================================="

          if resource_in_state "$ECR_ADDRESS"; then

            echo "ECR already exists in Terraform state."

          else

            if aws ecr describe-repositories \
              --repository-names "$ECR_REPOSITORY" \
              --region "$AWS_REGION" >/dev/null 2>&1; then

              echo "ECR exists in AWS."
              echo "Importing ECR repository: $ECR_REPOSITORY"

              terraform import \
                -input=false \
                "$ECR_ADDRESS" \
                "$ECR_REPOSITORY"

            else

              echo "ECR does not exist."
              echo "Terraform will create the repository."

            fi

          fi

          # ==================================================
          # VERIFY ECR IMPORT
          # ==================================================

          if resource_in_state "$ECR_ADDRESS"; then
            echo "SUCCESS: ECR is in Terraform state."
          else
            echo "ECR is not in Terraform state."
          fi

          # ==================================================
          # KMS ALIAS
          # ==================================================

          KMS_ADDRESS='module.eks.module.kms.aws_kms_alias.this["cluster"]'

          echo ""
          echo "=========================================="
          echo "KMS ALIAS IMPORT"
          echo "=========================================="

          if resource_in_state "$KMS_ADDRESS"; then

            echo "KMS alias already exists in Terraform state."

          else

            if aws kms describe-alias \
              --alias-name "alias/eks/$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" >/dev/null 2>&1; then

              echo "KMS alias exists in AWS."
              echo "Importing KMS alias:"
              echo "alias/eks/$EKS_CLUSTER_NAME"

              terraform import \
                -input=false \
                "$KMS_ADDRESS" \
                "alias/eks/$EKS_CLUSTER_NAME"

            else

              echo "KMS alias does not exist."
              echo "Terraform will create the alias."

            fi

          fi

          # ==================================================
          # VERIFY KMS IMPORT
          # ==================================================

          echo ""
          echo "Checking KMS state..."

          if resource_in_state "$KMS_ADDRESS"; then

            echo "SUCCESS: KMS alias is in Terraform state."

          else

            echo "ERROR: KMS alias is NOT in Terraform state."

            echo ""
            echo "Terraform state:"
            terraform state list || true

            exit 1

          fi

          # ==================================================
          # CLOUDWATCH LOG GROUP
          # ==================================================

          LOG_GROUP_ADDRESS='module.eks.aws_cloudwatch_log_group.this[0]'

          echo ""
          echo "=========================================="
          echo "CLOUDWATCH LOG GROUP IMPORT"
          echo "=========================================="

          if resource_in_state "$LOG_GROUP_ADDRESS"; then

            echo "CloudWatch log group already exists in Terraform state."

          else

            if aws logs describe-log-groups \
              --log-group-name-prefix "/aws/eks/$EKS_CLUSTER_NAME/cluster" \
              --region "$AWS_REGION" \
              --query "logGroups[?logGroupName=='/aws/eks/$EKS_CLUSTER_NAME/cluster'].logGroupName" \
              --output text \
              | grep -q "/aws/eks/$EKS_CLUSTER_NAME/cluster"; then

              echo "CloudWatch log group exists in AWS."
              echo "Importing CloudWatch log group."

              terraform import \
                -input=false \
                "$LOG_GROUP_ADDRESS" \
                "/aws/eks/$EKS_CLUSTER_NAME/cluster"

            else

              echo "CloudWatch log group does not exist."
              echo "Terraform will create it."

            fi

          fi

          # ==================================================
          # VERIFY CLOUDWATCH IMPORT
          # ==================================================

          if resource_in_state "$LOG_GROUP_ADDRESS"; then

            echo "SUCCESS: CloudWatch log group is in Terraform state."

          else

            echo "CloudWatch log group is not in Terraform state."

          fi

          # ==================================================
          # FINAL STATE
          # ==================================================

          echo ""
          echo "=========================================="
          echo "TERRAFORM STATE AFTER IMPORT"
          echo "=========================================="

          terraform state list

      # ======================================================
      # EXPLICIT KMS STATE CHECK
      # ======================================================

      - name: Verify KMS Terraform State
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          KMS_ADDRESS='module.eks.module.kms.aws_kms_alias.this["cluster"]'

          echo "=========================================="
          echo "VERIFY KMS TERRAFORM STATE"
          echo "=========================================="

          echo "Expected Terraform address:"
          echo "$KMS_ADDRESS"

          echo ""
          echo "Searching Terraform state..."

          if terraform state list | grep -Fxq "$KMS_ADDRESS"; then

            echo ""
            echo "=========================================="
            echo "SUCCESS"
            echo "=========================================="

            echo "KMS alias is managed by Terraform."

            echo ""
            echo "Terraform KMS state:"
            terraform state show "$KMS_ADDRESS"

          else

            echo ""
            echo "=========================================="
            echo "ERROR"
            echo "=========================================="

            echo "KMS alias is NOT in Terraform state."

            echo ""
            echo "Current Terraform state:"
            terraform state list || true

            exit 1

          fi

      # ======================================================
      # TERRAFORM FORMAT
      # ======================================================

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          terraform fmt -check -recursive

      # ======================================================
      # TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          terraform validate

      # ======================================================
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "TERRAFORM PLAN"
          echo "=========================================="

          terraform plan \
            -input=false \
            -out=tfplan

      # ======================================================
      # TERRAFORM APPLY
      # ======================================================

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "TERRAFORM APPLY"
          echo "=========================================="

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # ======================================================
      # CONFIGURE KUBECTL
      # ======================================================

      - name: Configure kubeconfig
        if: github.event_name != 'pull_request'
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURE KUBECTL"
          echo "=========================================="

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # ======================================================
      # VERIFY EKS
      # ======================================================

      - name: Verify EKS
        if: github.event_name != 'pull_request'
        run: |
          set -e

          echo "=========================================="
          echo "EKS CLUSTER"
          echo "=========================================="

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

          echo ""
          echo "=========================================="
          echo "EKS NODES"
          echo "=========================================="

          kubectl get nodes

      # ======================================================
      # SETUP HELM
      # ======================================================

      - name: Setup Helm
        if: github.event_name != 'pull_request'
        uses: azure/setup-helm@v4
        with:
          version: latest

      # ======================================================
      # ADD AWS EKS HELM REPOSITORY
      # ======================================================

      - name: Add EKS Helm repository
        if: github.event_name != 'pull_request'
        run: |
          set -e

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

      # ======================================================
      # INSTALL AWS LOAD BALANCER CONTROLLER
      # ======================================================

      - name: Install AWS Load Balancer Controller
        if: github.event_name != 'pull_request'
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL AWS LOAD BALANCER CONTROLLER"
          echo "=========================================="

          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version 1.14.0 \
            --set clusterName="$EKS_CLUSTER_NAME" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --wait \
            --timeout 10m

      # ======================================================
      # VERIFY AWS LOAD BALANCER CONTROLLER
      # ======================================================

      - name: Verify AWS Load Balancer Controller
        if: github.event_name != 'pull_request'
        run: |
          set -e

          echo "=========================================="
          echo "SERVICE ACCOUNT"
          echo "=========================================="

          kubectl get serviceaccount \
            aws-load-balancer-controller \
            -n kube-system

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT"
          echo "=========================================="

          kubectl get deployment \
            aws-load-balancer-controller \
            -n kube-system

          echo ""
          echo "=========================================="
          echo "PODS"
          echo "=========================================="

          kubectl get pods \
            -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller

      # ======================================================
      # FINAL TERRAFORM STATE
      # ======================================================

      - name: Final Terraform State
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=========================================="
          echo "FINAL TERRAFORM STATE"
          echo "=========================================="

          terraform state list || true
