replicaCount: 2

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  targetType: ip
  healthcheckPath: /hello-world/

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /hello-world/
    initialDelaySeconds: 20
    periodSeconds: 10
  liveness:
    path: /hello-world/
    initialDelaySeconds: 40
    periodSeconds: 20

