{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "ms1.fullname" . }}

  labels:
    {{- include "ms1.labels" . | nindent 4 }}

  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.targetType | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthcheckPath | quote }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - http:
        paths:
          - path: /hello-world
            pathType: Prefix

            backend:
              service:
                name: {{ include "ms1.fullname" . }}
                port:
                  number: {{ .Values.service.port }}

{{- end }}
